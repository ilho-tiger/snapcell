name: CI

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze
        working-directory: app
      - run: dart analyze
        working-directory: packages/sheet_engine
      - run: dart format --output=none --set-exit-if-changed app packages
      - run: dart test
        working-directory: packages/sheet_engine
      - run: flutter test
        working-directory: app

  build-apk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    # Secrets live in this environment, which is restricted to v* tags.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag and signing secrets
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must look like v1.2.3"; exit 1; }
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "$v is not set in the release environment"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Write signing config
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" "$RUNNER_TEMP/release.jks" \
            > app/android/key.properties
      - name: Build signed APK
        working-directory: app
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-name="${TAG#v}" --build-number="${{ github.run_number }}"
      - name: Create release
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "snapcell-$TAG.apk"
          gh release create "$TAG" "snapcell-$TAG.apk" \
            --title "Snapcell $TAG" \
            --notes "Snapcell $TAG (arm64 APK, signed with the release key)"
