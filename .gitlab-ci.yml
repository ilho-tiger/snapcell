image: ghcr.io/cirruslabs/flutter:3.44.0

stages:
  - check
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - app/**/*
        - packages/**/*
        - pubspec.yaml
        - pubspec.lock
        - .fvmrc
        - .gitlab-ci.yml

variables:
  FLUTTER_HOME: $CI_PROJECT_DIR/.flutter
  PUB_CACHE: $CI_PROJECT_DIR/.pub-cache
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

.cache-flutter: &cache-flutter
  key:
    prefix: flutter
    files:
      - .fvmrc
  paths:
    - .flutter

.cache-pub: &cache-pub
  key:
    prefix: pub
    files:
      - pubspec.lock
  paths:
    - .pub-cache

.cache-gradle: &cache-gradle
  key: gradle
  paths:
    - .gradle

.flutter:
  cache:
    - *cache-flutter
    - *cache-pub
  before_script:
    - FLUTTER_VERSION=$(grep -o '[0-9][0-9.]*' .fvmrc)
    - '[ -d "$FLUTTER_HOME" ] || git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_HOME"'
    - export PATH="$FLUTTER_HOME/bin:$PATH"
    - flutter --version
    - flutter pub get

.flutter-android:
  extends: .flutter
  cache:
    - *cache-flutter
    - *cache-pub
    - *cache-gradle

check:
  extends: .flutter
  stage: check
  interruptible: true
  script:
    - (cd app && flutter analyze)
    - (cd packages/sheet_engine && dart analyze)
    - dart format --output=none --set-exit-if-changed app packages
    - (cd packages/sheet_engine && dart test)
    - (cd app && flutter test)

build-apk:
  extends: .flutter-android
  stage: build
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - cd app && flutter build apk --debug
  artifacts:
    paths:
      - app/build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

build-release:
  extends: .flutter-android
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must look like v1.2.3"; exit 1; }
      for v in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
        eval "val=\${$v:-}"
        [ -n "$val" ] || { echo "$v is not set (protected variable, protected tag required)"; exit 1; }
      done
      printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
        "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE" \
        > app/android/key.properties
    - >
      cd app && flutter build apk --release --target-platform android-arm64
      --build-name="${CI_COMMIT_TAG#v}" --build-number="$CI_PIPELINE_IID"
    - cp build/app/outputs/flutter-apk/app-release.apk "../snapcell-$CI_COMMIT_TAG.apk"
  artifacts:
    paths:
      - snapcell-$CI_COMMIT_TAG.apk
    expire_in: 1 week

publish:
  stage: release
  image: curlimages/curl:8.23.0
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build-release
  script:
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "snapcell-$CI_COMMIT_TAG.apk" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/snapcell/$CI_COMMIT_TAG/snapcell-$CI_COMMIT_TAG.apk"'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - publish
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Snapcell $CI_COMMIT_TAG (arm64 APK, signed with the release key)"
    assets:
      links:
        - name: snapcell-$CI_COMMIT_TAG.apk
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/snapcell/$CI_COMMIT_TAG/snapcell-$CI_COMMIT_TAG.apk
          link_type: package
